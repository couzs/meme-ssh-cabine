id: kdm-mail
theme: TMS & KDM
titre: KDM dans la boîte mail mais absentes du TMS
quand: 'Le client voit ses KDM dans sa messagerie, le scan du TMS ne les remonte pas.'
symptomes: [kdm manquante, mail, imap, scan kdm]
comprendre: |
  Le TMS relève la boîte mail en IMAP, puis dépose chaque KDM en FTP sur le LMS avant de l’importer en base. Si le mail est bien reçu, le blocage est presque toujours au dépôt : disque du LMS plein ou fichier écrit à moitié. On remonte la chaîne dans l’ordre : boîte mail, journal, disque du LMS, fichiers déposés, base.
etapes:
  - ref: boites-mail-sans-secrets
    titre: Dernière réception de la boîte
    attendu: 'lastMessage récent = la relève IMAP fonctionne, le problème est après'
  - ref: erreurs-de-releve-et-de-depot-kdm
    titre: Erreurs de relève et de dépôt
  - titre: Espace libre du LMS
    machine: tms
    commande: |-
      ssh sysadm@{LMS} df -h /opt/lms-ymagis
    attendu: 'Sous 90 %. 100 % = cause trouvée : procédure « LMS plein »'
  - ref: kdm-vides-ou-tronquees-sur-le-lms
    titre: KDM vides ou tronquées sur le LMS
  - ref: kdm-en-base-pour-un-film
    titre: Le film est-il en base ?
  - ref: films-avec-une-kdm-encore-valide
    titre: Films avec une KDM valide
    attendu: 'Le film du client apparaît avec une date de fin future'
  - titre: Après correction
    machine: man
    consigne: 'Relancer un scan dans le TMS. Pour les fichiers arrivés vides : faire retransférer le mail d’origine vers la boîte KDM.'
