id: equip
theme: Réseau
titre: 'Équipement non détecté : diagnostic express'
quand: 'Alerte DEVICE_OFFLINE ou équipement grisé dans le TMS.'
symptomes: [device_offline, grisé, équipement absent, projecteur absent]
comprendre: |
  Quatre questions dans l’ordre : répond-il ? qui répond (MAC) ? ses services sont-ils ouverts ? le TMS l’attend-il à cette IP ? La réponse à chacune oriente vers le bon correctif (câble, IP, service, configuration du TMS).
etapes:
  - ref: ping
    titre: Joignable ?
    attendu: 'Réponses = vivant'
  - ref: mac-de-l-equipement
    titre: Quelle MAC ?
  - ref: ports-sans-nmap
    titre: Quels ports ?
    attendu: '43758 OK = API IMS/ICMP joignable'
  - ref: quelle-salle-a-cette-ip
    titre: Quelle salle dans le TMS ?
    attendu: 'La salle qui attend cette IP'
attention: 'Alertes DEVICE_OFFLINE la nuit = projecteurs éteints, normal.'
