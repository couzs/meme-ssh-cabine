id: barco-ip
theme: Réseau
titre: Retrouver un Barco parti sur une IP inconnue
quand: 'Projecteur injoignable après une coupure ou une intervention.'
symptomes: [barco, ip perdue, projecteur injoignable]
comprendre: |
  Un projecteur sur une mauvaise IP continue d’émettre des trames avec sa MAC Barco (00:04:a5). En les captant sur l’ORC, on lit l’IP qu’il croit avoir, puis on se met dans son réseau pour le corriger.
copier_tout: false
etapes:
  - ref: capter-tous-les-barco
    titre: Capter les trames Barco
    attendu: 'Souvent un ARP « who-has X tell Y » : Y = IP réelle. Renseigne BAD_IP.'
  - titre: IP temporaire dans son réseau
    machine: orc
    niveau: action
    commande: |-
      ip addr add {TMP_IP}/24 dev {IF}
    attendu: 'Pas d’erreur'
  - titre: Le joindre
    machine: orc
    commande: |-
      ping -c 2 {BAD_IP} ; for p in 80 43728 43758; do timeout 2 bash -c "</dev/tcp/{BAD_IP}/$p" 2>/dev/null && echo "$p OK" || echo "$p KO"; done
    attendu: 'Ports OK = corriger son IP dans Communicator'
  - ref: retirer-l-ip-temporaire
    titre: Retirer l’IP temporaire
    attendu: 'Toujours à la fin'
