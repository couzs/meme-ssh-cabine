id: lms-plein
theme: Stockage
titre: 'LMS plein : trouver et libérer de la place'
quand: 'KDM en erreur FTP, ingests qui échouent, SITE DF proche de zéro.'
symptomes: [lms plein, disque plein, tcs, place, purge]
comprendre: |
  Sur un TCS (Ubuntu), le volume /opt/lms-ymagis contient la bibliothèque (data), les inbox Eclair et IDC (view) et la corbeille du bureau. Plein, il bloque KDM et ingests. On libère d’abord ce qui est déjà jeté (corbeille), puis les contenus validés par le client, en vérifiant qu’aucun film encore exploité (KDM valide) n’est touché.
etapes:
  - ref: remplissage-du-volume-de-contenu
    titre: Remplissage du volume
    attendu: 'Note l’espace libre de départ pour le ticket'
  - ref: repartition-corbeilles-comprises
    titre: Répartition, corbeilles comprises
  - ref: vue-complete-inbox
    titre: Gros DCP en inbox
    attendu: 'Longs métrages terminés encore en inbox Eclair / IDC'
  - ref: corbeille-plus-gros-elements
    titre: Corbeille du bureau
    attendu: 'Souvent plusieurs To jamais libérés'
  - ref: films-avec-une-kdm-encore-valide
    titre: Films encore exploités (sur le TMS)
    attendu: 'Tout film de cette liste reste en place'
  - titre: Validation du client
    machine: man
    consigne: 'Envoyer la liste (film + taille) au client et attendre son accord écrit. Ne garder que les films qu’il cite.'
  - ref: vider-la-corbeille-du-bureau
    titre: Vider la corbeille
  - titre: Préparer la liste de purge (ne supprime rien)
    machine: lms
    commande: |-
      cd /opt/lms-ymagis/view && LISTE=$(ls -d eclair/inbox/*{FILM}*_FTR*) ; echo "$LISTE" ; echo "$LISTE" | grep -c . ; echo "$LISTE" | grep -ciE "_TLR|_TSR|_ADV" ; du -sch $LISTE | tail -1
    attendu: 'Liste, nombre de dossiers, 0 bande-annonce ou pub, taille totale. Ajouter un motif par film validé.'
  - titre: Supprimer la liste (même session)
    machine: lms
    niveau: danger
    commande: |-
      cd /opt/lms-ymagis/view && [ -n "$LISTE" ] && sudo rm -rf -- $LISTE ; df -h /opt/lms-ymagis
    attendu: 'Espace libre en hausse de la taille annoncée'
  - titre: extra_exchange après la purge
    machine: lms
    commande: |-
      \ps -eo pid,etime,args | grep [e]xtra_exchange ; ls -l /tmp/.extra_receive.lock 2>&1
    attendu: 'Si le verrou reste sans process : procédure « extra_exchange bloqué »'
attention: 'Purger l’inbox IDC pendant un passage d’extra_exchange peut le faire planter : vérifier ensuite le verrou.'
