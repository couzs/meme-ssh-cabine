id: lms-ftp-plein
theme: Stockage
titre: 'Distributeur refusé (« permission denied ») : LMS Debian plein'
quand: 'Hyphen ou un autre distributeur n’arrive plus à déposer, les nouveaux DCP n’apparaissent pas sur le LMS.'
symptomes: [permission denied, hyphen, ftp, distributeur, dépôt refusé]
comprendre: |
  Beaucoup d’outils de livraison affichent « permission denied » pour n’importe quelle erreur d’écriture. Côté serveur FTP, le vrai message est souvent « No space left on device ». On teste donc l’écriture au bon endroit, dans lms/ et jamais à la racine, avant d’accuser les droits. Sur ces LMS Debian, aucune purge n’est automatique.
etapes:
  - ref: tester-l-ecriture-en-ftp
    titre: Tester l’écriture
  - titre: Se connecter au LMS
    machine: tms
    commande: |-
      ssh sysadm@{LMS}
    attendu: 'Puis sudo -i. Mot de passe refusé : ne pas insister (blocage possible), le demander.'
  - ref: remplissage-du-volume-des-dcp
    titre: Remplissage
    attendu: '100 % = cause confirmée'
  - ref: dcp-par-date-d-arrivee
    titre: Dernier dépôt réussi
    attendu: 'Date de début de la panne. Le dernier DCP arrivé est souvent tronqué.'
  - ref: les-40-plus-gros-dcp
    titre: Plus gros DCP
    attendu: 'Base de la liste de purge'
  - ref: dossiers-vides-ou-incomplets
    titre: Dossiers vides ou tronqués
    attendu: 'À ajouter au nettoyage'
  - ref: erreurs-ftp
    titre: Le message exact côté serveur
    attendu: '« No space left on device » confirme le disque plein'
  - ref: une-purge-automatique-existe
    titre: Purge automatique ?
    attendu: 'Rien de spécifique = ménage manuel, à signaler au N3'
  - titre: Validation du client
    machine: man
    consigne: 'Envoyer la liste : anciens films et reprises d’abord, avec le nombre de versions et la taille. Attendre l’accord écrit.'
  - ref: preparer-une-liste-de-purge-ne-supprime-rien
    titre: Préparer la liste (ne supprime rien)
    attendu: 'Exactement les dossiers validés. Un motif par film.'
  - ref: supprimer-la-liste-meme-session
    titre: Supprimer (même session)
    attendu: 'Espace libre en hausse de la taille annoncée'
  - titre: Relance
    machine: man
    consigne: 'Refaire le test d’écriture, puis demander au distributeur de relancer ses envois, en priorité les DCP tronqués (supprimés avant).'
attention: 'Ne jamais supprimer sans accord écrit. Un DCP tronqué doit être supprimé avant d’être renvoyé.'
