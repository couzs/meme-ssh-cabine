id: nat
titre: 'ORC : NAT & ferm'
groupe: Réseau
intro: 'Le TMS ne voit pas les vraies IP des salles : il parle à des IP virtuelles que l’ORC traduit (NAT 1:1). La correspondance est dans network.cfg, transformée en règles par netconfig.pl puis appliquée par ferm. Toutes ces commandes se lancent en root sur l’ORC.'

commandes:
  - id: correspondances-d-une-salle
    titre: Correspondances d’une salle
    machine: orc
    niveau: info
    commande: |-
      grep -nwF -e "{VIP}" -e "{OLD}" -e "{REAL}" /etc/ymagis/network.cfg
    but: 'Les lignes « IP virtuelle = IP réelle » qui concernent ces adresses.'
    detail: |
      -n → numéro de ligne
      -w -F → adresse exacte (un point est un point, et .4 ne remonte pas .41)
      -e … → plusieurs adresses cherchées en même temps
    exemple: |
      42:203.0.113.41 = 192.0.2.42
    lecture: 'À gauche, l’IP virtuelle (côté TMS) ; à droite, l’IP réelle en salle.'
    mots: [nat, network.cfg, ip virtuelle, correspondance]

  - id: regle-nat-active-pour-une-ip-virtuelle
    titre: Règle NAT active pour une IP virtuelle
    machine: orc
    niveau: info
    commande: |-
      iptables -t nat -S | grep -F "{VIP}/"
    but: 'Où pointe réellement l’IP virtuelle en ce moment (règle appliquée, pas seulement écrite).'
    exemple: |
      -A PREROUTING -d 203.0.113.41/32 -j DNAT --to-destination 192.0.2.42
    attendu: '--to-destination = IP réelle visée'
    mots: [nat, dnat, iptables]

  - id: toutes-les-regles-nat
    titre: Toutes les règles NAT
    machine: orc
    niveau: info
    commande: |-
      iptables -t nat -S
    but: 'Redirections (DNAT) et réécritures de source (SNAT) en vigueur.'
    lecture: 'Lignes `-A PREROUTING … -j DNAT --to-destination X` = l’IP virtuelle est redirigée vers X. Lignes `-A POSTROUTING … -j SNAT` = la source est réécrite en IP de l’ORC.'
    mots: [nat, iptables]

  - id: valeur-dans-la-conf-ferm
    titre: Valeur dans la conf ferm
    machine: orc
    niveau: info
    commande: |-
      grep -rnF "{VIP}" /etc/ferm/
    but: 'netconfig.conf contient les &VMAP_MGT / &VMAP_STO lus par ferm.'
    exemple: |
      /etc/ferm/netconfig.conf:58:&VMAP_MGT(203.0.113.41, 192.0.2.42);
    lecture: 'Le premier argument est l’IP virtuelle, le second l’IP réelle. Elle doit correspondre à network.cfg.'
    mots: [ferm, netconfig]

  - id: previsualiser-les-regles-ferm
    titre: Prévisualiser les règles ferm
    machine: orc
    niveau: info
    commande: |-
      ferm --noexec --lines /etc/ferm/ferm.conf 2>&1 | grep -F "{VIP}"
    but: 'Ce que ferm appliquerait, sans rien appliquer.'
    detail: |
      --noexec → n’applique rien
      --lines → affiche les règles iptables qui seraient créées
    mots: [ferm, prévisualiser]

  - id: appliquer-ferm-avec-retour-automatique
    titre: Appliquer ferm avec retour automatique
    machine: orc
    niveau: danger
    commande: |-
      ferm --interactive /etc/ferm/ferm.conf
    but: 'Applique les nouvelles règles, puis demande confirmation. Taper `yes` dans les 30 secondes. Sans réponse (session coupée par une mauvaise règle), ferm revient tout seul aux anciennes règles.'
    attendu: 'Le message de confirmation, puis « yes » tapé dans les 30 s'
    lecture: 'Si ta session SSH ne répond plus après l’application, n’essaie rien : au bout de 30 secondes, ferm remet les anciennes règles et la connexion revient.'
    attention: 'Toujours prévisualiser avant. Une règle fausse peut couper tout le site, ta session comprise : c’est pour ça qu’on utilise --interactive.'
    mots: [ferm, appliquer, pare-feu]

  - id: regenerer-netconfig-conf
    titre: Régénérer netconfig.conf
    machine: orc
    niveau: action
    commande: |-
      cp -a /etc/ferm/netconfig.conf /root/netconfig.conf.avant_regen ; netconfig.pl ferm_config ; diff /root/netconfig.conf.avant_regen /etc/ferm/netconfig.conf
    but: 'netconfig.pl relit network.cfg et réécrit netconfig.conf. La commande garde une copie et montre les différences.'
    lecture: 'L’ordre des lignes change à chaque génération : seul le contenu compte. Les lignes `<` sont l’ancien fichier, `>` le nouveau.'
    mots: [netconfig, régénérer]

  - id: qui-utilise-network-cfg
    titre: Qui utilise network.cfg
    machine: orc
    niveau: info
    commande: |-
      grep -rl "network.cfg" /usr/local/bin /usr/local/sbin /etc/init.d 2>/dev/null
    but: 'Les scripts qui lisent network.cfg : getconfig.pl, orchestra_*.py, set_ftp_inbox.sh… aucun n’applique iptables directement.'
    lecture: 'Une ligne par script. Utile avant de modifier network.cfg pour savoir ce qui sera relu.'
    mots: [network.cfg, scripts]

  - id: puppet-actif
    titre: Puppet actif ?
    machine: orc
    niveau: info
    commande: |-
      systemctl is-active puppet ; ls -l /var/lib/puppet/state/last_run_summary.yaml 2>/dev/null
    but: 'Puppet impose la configuration centrale : s’il est actif, une modification locale peut être écrasée.'
    lecture: '**inactive** = pas d’écrasement immédiat d’une modification locale. La date du fichier last_run_summary = dernier passage de Puppet.'
    mots: [puppet, configuration]

  - id: puppet-a-blanc
    titre: Puppet à blanc
    machine: orc
    niveau: info
    commande: |-
      puppet agent -t --noop
    but: 'Montre ce que Puppet changerait, sans rien appliquer.'
    lecture: 'Les lignes « Would have triggered » ou « current_value … should be » montrent ce que Puppet écraserait. Aucune ligne de ce type = la configuration locale est conforme.'
    mots: [puppet, noop]
