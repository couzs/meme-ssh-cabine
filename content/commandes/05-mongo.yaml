id: mongo
titre: Base Mongo
groupe: TMS & Linux
intro: 'MongoDB contient la mémoire du TMS : salles et équipements (booths), bibliothèques (library), films (cpls), clés (kdms), boîtes mail (mailAccounts). Ces commandes lisent seulement : elles ne modifient rien.'

commandes:
  - id: ouvrir-la-base
    titre: Ouvrir la base
    machine: tms
    niveau: info
    commande: |-
      mongo ytms
    but: 'Ouvre la console de la base ytms (celle du TMS) pour taper des requêtes à la main.'
    lecture: 'L’invite devient `>`. `show collections` liste les tables, `exit` pour sortir. Ne tape jamais `drop`, `remove` ou `update` sans procédure et sans sauvegarde.'
    voir: [sauvegarde-datee-de-la-base]
    mots: [mongo, console, base]

  - id: la-base-repond
    titre: La base répond ?
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet ytms --eval 'db.getCollectionNames().join(", ")'
    but: 'Test le plus simple : si Mongo répond, la liste des collections s’affiche.'
    exemple: |
      booths, cpls, kdms, library, mailAccounts, …
    attendu: 'Une liste de collections'
    si_ko: '« connect failed » ou « Connection refused » : Mongo est arrêté. Voir « MongoDB (la base) » puis « Relancer MongoDB ».'
    mots: [mongo, test, répond]

  - id: salles-equipements-et-ip
    titre: Salles, équipements et IP
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet ytms --eval 'db.booths.find().sort({number:1}).forEach(function(b){b.devices.forEach(function(d){print("salle "+b.name+" | "+d.type+" | "+d.make+" | "+d.model+" | "+d.ipAddress)})})'
    but: 'À lancer en premier sur un site inconnu : la liste de ce que le TMS attend dans chaque salle, avec les IP.'
    detail: |
      db.booths.find() → toutes les salles (booth = cabine)
      .sort({number:1}) → dans l’ordre des numéros de salle
      b.devices.forEach → pour chaque équipement de la salle
      print(…) → une ligne : salle | type | marque | modèle | IP
    exemple: |
      salle 1 | PROJECTOR | Barco | DP4K-32B | 203.0.113.13
      salle 1 | SERVER | Doremi | IMS3000 | 203.0.113.11
      salle 1 | SOUND_PROCESSOR | Dolby | CP650 | 203.0.113.16
    lecture: 'Ce sont les IP **virtuelles** vues par le TMS (traduites par l’ORC). Pour l’IP réelle en salle, voir « Correspondances d’une salle » sur l’ORC.'
    voir: [correspondances-d-une-salle]
    mots: [salles, équipements, ip, inventaire, booths]

  - id: quelle-salle-a-cette-ip
    titre: Quelle salle a cette IP ?
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet ytms --eval 'db.booths.find({"devices.ipAddress":"{IP}"},{name:1,number:1}).forEach(printjson)'
    but: 'Retrouver la salle à partir de l’IP d’une alerte.'
    exemple: |
      { "_id" : ObjectId("…"), "name" : "Salle 4", "number" : 4 }
    lecture: 'Rien ne s’affiche = aucune salle n’a cette IP dans le TMS (faute de frappe, ou IP réelle au lieu de l’IP virtuelle).'
    mots: [salle, ip, alerte]

  - id: bibliotheques-declarees
    titre: Bibliothèques déclarées
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet ytms --eval 'db.library.find({},{name:1,protocol:1,managementIp:1,inboxPath:1}).forEach(printjson)'
    but: 'LMS, Deluxe, Hyphen… : les sources de contenus que le TMS connaît, avec leur IP, leur protocole et leur dossier.'
    lecture: '**managementIp** = où le TMS va chercher ; **inboxPath** = dossier de dépôt. C’est là qu’on trouve la valeur de la variable KDM_DIR.'
    mots: [bibliothèque, library, lms, hyphen, inbox]

  - id: nombre-de-cpl-et-kdm
    titre: Nombre de CPL et KDM
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet ytms --eval 'print("CPL: "+db.cpls.count()+" | KDM: "+db.kdms.count())'
    but: 'Deux compteurs pour contrôler avant et après une opération sur la base.'
    exemple: |
      CPL: 1843 | KDM: 5210
    mots: [cpl, kdm, compter]

  - id: taille-de-la-base
    titre: Taille de la base
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet ytms --eval 'var s=db.stats(1024*1024); print("données "+s.dataSize.toFixed(0)+" Mo | index "+s.indexSize.toFixed(0)+" Mo | sur disque "+s.storageSize.toFixed(0)+" Mo")'
    but: 'Taille des données et des index en Mo.'
    exemple: |
      données 412 Mo | index 96 Mo | sur disque 520 Mo
    lecture: 'Une base de quelques centaines de Mo est normale. Une taille qui explose d’un coup (plusieurs Go) mérite un ticket N2 : souvent une collection de logs qui n’est plus purgée.'
    mots: [taille, base, stats]

  - id: version-de-mongo
    titre: Version de Mongo
    machine: tms
    niveau: info
    commande: |-
      mongo --quiet --eval 'db.version()'
    but: 'Version du serveur Mongo : à indiquer dans un ticket N2.'
    exemple: |
      3.2.22
    mots: [version, mongo]

  - id: mongodb-arrete-pour-manque-de-place
    titre: MongoDB arrêté pour manque de place ?
    machine: tms
    niveau: info
    commande: |-
      zcat -f $(ls -tr /var/log/mongodb/mongod.log* 2>/dev/null) 2>/dev/null | grep -aiE "no space|fatal assertion|shutting down|out of memory|SIGTERM|SIGKILL" | tail -15
    but: 'Retrouve dans le journal de MongoDB (archives comprises) les arrêts brutaux et leur cause, avec l’heure exacte.'
    detail: |
      zcat -f → lit les fichiers, qu’ils soient compressés (.gz) ou non
      ls -tr /var/log/mongodb/mongod.log* → le journal courant et ses archives, du plus ancien au plus récent
      grep -aiE → cherche ces motifs sans tenir compte des majuscules (-a : fichier lu comme du texte)
      tail -15 → les 15 dernières lignes trouvées
    exemple: |
      (forme indicative : seuls les mots-clés comptent)
      2026-10-30T21:07:12.431+0100 E STORAGE  [thread1] WiredTiger error (28) [...] No space left on device
      2026-10-30T21:07:12.433+0100 I -        [thread1] Fatal Assertion 28558
    lecture: |
      - **No space left on device** puis **Fatal Assertion 28558** (message WiredTiger, erreur 28) : MongoDB n’a plus pu écrire sur le disque et s’est arrêté lui-même. Sans MongoDB, la page web du TMS ne s’affiche plus.
      - L’heure donne le moment exact où le disque s’est rempli. À comparer avec ce qui tournait à ce moment-là (génération de DCP, ingest, copie).
      - **SIGTERM / shutting down** sans « no space » = arrêt demandé (redémarrage, coupure), pas une saturation.
      - `OutOfMemory` ou `SIGKILL` = manque de mémoire (voir `journal-du-noyau`).
    attendu: 'Aucune ligne si la base n’a pas été arrêtée'
    si_ko: 'Lignes « no space » : procédure « MongoDB arrêté : disque saturé temporairement ». Le disque peut être à 20 % le lendemain : il s’est rempli puis libéré (reboot, nettoyage des temporaires).'
    attention: 'Le disque qui paraît normal aujourd’hui ne prouve rien : c’est l’heure de l’erreur qui compte.'
    voir: [mongo-disque-sature, espace-disque, journal-du-noyau]
    mots: [mongo, wiredtiger, erreur 28, fatal assertion, disque plein, no space left]
    maj: 2026-11-06

  - id: comptes-locaux-du-tms
    titre: Comptes locaux du TMS (sans mot de passe)
    machine: tms
    niveau: info
    commande: |-
      mongo ytms --quiet --eval 'db.accounts.find({}, {password:0}).forEach(function(x){printjson(x);})'
    but: 'Liste les identifiants de connexion locaux du TMS et leurs rôles, **sans** afficher le mot de passe (le champ password est exclu de la requête).'
    detail: |
      mongo ytms --quiet → ouvre la base du TMS, sans bannière
      db.accounts.find({}, {password:0}) → tous les comptes, sauf le champ password
      forEach(… printjson) → affiche chaque compte
    exemple: |
      (forme indicative : les valeurs de rôle varient)
      { "_id" : "identifiant1", "roles" : [ "…" ] }
      { "_id" : "identifiant2", "roles" : [ "…" ] }
    lecture: |
      - L’**identifiant de connexion est le champ `_id`**. Sur le cas rencontré, il n’y avait que 4 comptes locaux (admin, guest, operator, support) et aucune adresse e-mail.
      - Un client qui se connecte avec son adresse e-mail alors qu’aucun compte n’en porte une peut voir la fenêtre vibrer sans message. À confirmer avec lui : quel identifiant lui a-t-on donné ?
      - Un TMS peut aussi être atteint par un lien d’accès intermédiaire (proxy) qui a ses propres comptes : savoir lequel il utilise avant de conclure.
    attention: 'Ne jamais afficher, copier ni coller les hash de mot de passe, et ne pas modifier un compte depuis la base : une réinitialisation passe par le N3.'
    voir: [acces-web-externes-du-jour, connexion-web-en-direct]
    mots: [comptes, accounts, identifiant, login, mot de passe oublié, utilisateurs]
    maj: 2026-11-06
