id: win
titre: PC / TeamViewer
groupe: PC
intro: 'Commandes sur le PC du site (via TeamViewer) ou sur ton poste. Ouvrir PowerShell en administrateur : clic droit sur le menu Démarrer → « Terminal (admin) » ou « Windows PowerShell (admin) ».'

commandes:
  - id: ip-et-passerelle-du-pc
    titre: IP et passerelle du PC
    machine: win
    niveau: info
    commande: |-
      ipconfig
    but: 'Le PC est-il sur le réseau cabine, et par où sort-il ?'
    lecture: '**IPv4 Address** = IP du PC, **Default Gateway** = sa passerelle. Une IP en 169.254.x.x = le PC n’a pas obtenu d’adresse (DHCP absent).'
    mots: [ipconfig, ip, pc]

  - id: detail-complet
    titre: Détail complet
    machine: win
    niveau: info
    commande: |-
      ipconfig /all
    but: 'MAC, DHCP activé ou non, DNS, pour chaque carte.'
    lecture: '**Physical Address** = MAC, **DHCP Enabled: No** = IP fixe (obligatoire pour ajouter une IP secondaire), **DNS Servers** = serveurs DNS.'
    mots: [ipconfig, dhcp, dns, mac]

  - id: nom-des-cartes
    titre: Nom des cartes
    machine: win
    niveau: info
    commande: |-
      Get-NetAdapter | Format-Table Name, Status, LinkSpeed, MacAddress
    but: 'Nom exact de chaque carte (à reporter dans la variable WIN_IF), état et vitesse.'
    exemple: |
      Name      Status LinkSpeed MacAddress
      ----      ------ --------- ----------
      Ethernet  Up     1 Gbps    00-11-22-33-44-55
    lecture: '**Name** est le nom à copier dans WIN_IF. Status Up = câble branché.'
    mots: [carte, adaptateur, nom]

  - id: config-ip-par-carte
    titre: Config IP par carte
    machine: win
    niveau: info
    commande: |-
      Get-NetIPConfiguration
    but: 'IP, passerelle et DNS de chaque carte.'
    lecture: 'Pour chaque carte : **IPv4Address**, **IPv4DefaultGateway** (passerelle) et **DNSServer**.'
    mots: [configuration, ip]

  - id: tester-un-port
    titre: Tester un port
    machine: win
    niveau: info
    commande: |-
      Test-NetConnection {IP} -Port {PORT}
    but: 'Le PC joint-il ce port de l’équipement ? (Ex. 43728 = Communicator Barco, 43758 = API IMS.)'
    attendu: 'TcpTestSucceeded : True'
    mots: [port, test, powershell]

  - id: ping-continu
    titre: Ping continu
    machine: win
    niveau: info
    commande: |-
      ping -t {IP}
    but: 'Ping sans fin : pratique pendant un redémarrage pour voir l’équipement revenir. Ctrl+C pour arrêter.'
    lecture: '« Request timed out » pendant le redémarrage de l’équipement, puis « Reply from … » quand il revient.'
    mots: [ping, continu]

  - id: chemin-reseau-pc
    titre: 'Chemin réseau depuis le PC'
    machine: win
    niveau: info
    commande: |-
      tracert -d {IP}
    but: 'Par où passent les paquets.'
    lecture: 'Chaque ligne est un routeur traversé. Des `*` à partir d’une ligne = les paquets se perdent après le dernier routeur affiché.'
    mots: [tracert, chemin]

  - id: table-arp
    titre: Table ARP
    machine: win
    niveau: info
    commande: |-
      arp -a
    but: 'MAC vues par le PC (format 00-04-a5-…).'
    lecture: 'Dynamic = MAC apprise récemment. Le début de la MAC indique le fabricant (00-04-a5 = Barco).'
    mots: [arp, mac]

  - id: table-de-routage
    titre: Table de routage
    machine: win
    niveau: info
    commande: |-
      route print -4
    but: 'Routes actives du PC.'
    lecture: 'La ligne « 0.0.0.0 0.0.0.0 » donne la passerelle par défaut. Une route ajoutée à la main apparaît avec le réseau et l’IP de l’ORC.'
    mots: [route, routage]

  - id: ip-secondaire-temporaire
    titre: IP secondaire temporaire
    machine: win
    niveau: action
    commande: |-
      New-NetIPAddress -InterfaceAlias "{WIN_IF}" -IPAddress {TMP_IP} -PrefixLength 24
    but: 'Ajoute une IP au PC pour joindre un équipement dans un autre réseau. Sans passerelle : ne coupe pas TeamViewer.'
    attendu: 'Un bloc IPAddress / InterfaceAlias / PrefixLength 24 s’affiche'
    attention: 'Uniquement si la carte est en IP fixe. La retirer après.'
    voir: [retirer-l-ip-temporaire-pc]
    mots: [ip secondaire, temporaire]

  - id: retirer-l-ip-temporaire-pc
    titre: 'Retirer l’IP temporaire du PC'
    machine: win
    niveau: action
    commande: |-
      Remove-NetIPAddress -IPAddress {TMP_IP} -Confirm:$false
    but: 'Nettoyage.'
    attendu: 'Aucun message ; `ipconfig` ne montre plus l’IP temporaire'
    mots: [nettoyage, ip temporaire]

  - id: route-temporaire-via-l-orc
    titre: Route temporaire via l’ORC
    machine: win
    niveau: action
    commande: |-
      route add {BAD_NET} mask 255.255.255.0 {ORC}
    but: 'Envoie le trafic vers le réseau de l’équipement perdu à travers l’ORC. Sans -p : disparaît au redémarrage du PC.'
    attendu: 'OK!'
    lecture: 'À taper dans une invite de commandes ou PowerShell **en administrateur**, sinon « The requested operation requires elevation ».'
    voir: [gw-temp]
    mots: [route, temporaire]

  - id: supprimer-la-route
    titre: Supprimer la route
    machine: win
    niveau: action
    commande: |-
      route delete {BAD_NET}
    but: 'Nettoyage.'
    attendu: 'OK!'
    mots: [route, supprimer]

  - id: tunnel-vers-l-interface-web
    titre: Tunnel vers l’interface web
    machine: win
    niveau: info
    commande: |-
      ssh -L 8080:{IP}:80 root@{ORC}
    but: 'Depuis ton poste : ouvrir ensuite http://localhost:8080 dans le navigateur = interface web de l’équipement, à travers l’ORC.'
    detail: |
      -L 8080:IP:80 → ce qui arrive sur le port 8080 de ton poste est envoyé au port 80 de l’équipement
      root@ORC → en passant par l’ORC
    lecture: 'Laisser la fenêtre SSH ouverte tant que tu utilises l’interface web. Pour une interface en HTTPS, remplacer 80 par 443 et ouvrir https://localhost:8080.'
    mots: [tunnel, ssh, web, localhost]
