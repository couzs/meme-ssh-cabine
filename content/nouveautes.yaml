# Journal des nouveautés, affiché dans l’application (le plus récent en premier).
# Ajoute une entrée à chaque modification utile pour l’équipe.
- date: 2026-10-18
  titre: Relecture complète de l’outil
  texte: |
    - Toutes les fiches ont désormais au moins une aide à la lecture (résultat attendu, comment lire, exemple).
    - Chaque étape de procédure indique ce qu’on doit voir.
    - « Copier tout » n’apparaît plus quand une étape demande un mot de passe ou ouvre une session (ssh, sudo, ftp) : la saisie avalerait les lignes collées ensuite.
    - Nouvelle fiche « Serveur de la salle joignable ? ».
    - Mon site : chaque champ montre un exemple et son libellé complet.
- date: 2026-10-18
  titre: Version 3 en ligne
  texte: |
    - Le mémo devient une application en ligne, partagée par toute l’équipe et mise à jour en direct.
    - Chaque commande s’explique : décomposition, exemple de sortie, comment lire le résultat, que faire si ça ne va pas.
    - Nouvelle rubrique « Apprendre » pour débuter en SSH.
    - Lien direct vers chaque fiche (bouton 🔗) à coller dans un ticket.
