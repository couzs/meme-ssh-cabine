# Journal des nouveautés, affiché dans l’application (le plus récent en premier).
# Ajoute une entrée à chaque modification utile pour l’équipe.
- date: 2026-10-27
  titre: Journal d’intervention, analyse d’une sortie, diagnostic en une commande
  texte: |
    - Bouton « Journal » : chaque commande copiée s’y ajoute avec l’heure, tu peux ajouter des notes, puis « Copier le compte rendu » pour le ticket. Le journal reste dans l’onglet et disparaît à sa fermeture.
    - Bouton « Analyser » : colle le résultat d’une commande, le mémo repère les motifs connus (disque plein, connexion refusée, service en échec, heure non synchronisée, KDM…) et renvoie vers la bonne fiche. Les règles sont dans content/analyse.yaml.
    - Nouvelle rubrique « Diagnostic en une commande » : un copier-coller par machine (Linux, TMS, LMS, ORC) qui ne détaille que les problèmes.
- date: 2026-10-27
  titre: Sommaire des pages, consultés récemment, réseau lent
  texte: |
    - Les pages longues (glossaire, repères, guides) affichent un sommaire cliquable en haut.
    - Accueil : encart « Consultés récemment » avec les dernières fiches et procédures ouvertes.
    - Recherche : les mots cherchés sont surlignés dans les résultats (sans tenir compte des accents).
    - Procédures : bouton « Résumé pour ticket » (titre, symptôme, étapes numérotées avec leurs commandes).
    - Hors ligne : si le réseau répond en plus de 4 secondes, le mémo s’affiche depuis la copie locale.
- date: 2026-10-26
  titre: Scan KDM par mail bloqué à 0 %, bibliothèques en échec, reconstruction RAID
  texte: |
    - Nouvelle procédure « Scan KDM par la boîte mail bloqué à 0 % » : résultat de la relève, parcours dossier par dossier, compte configuré, dossier de dépôt sur la bibliothèque, comparaison avec le chemin du TMS.
    - Rubrique KDM : « Résultat de la relève de la boîte mail », « Relève pas à pas », « Échecs de connexion aux bibliothèques » (No route to host, 530, timeout) et « Dossier de dépôt des KDM de la boîte mail ».
    - Réparation : « Avancement d’une reconstruction RAID » (temps restant sur Synology ou Linux).
- date: 2026-10-20
  titre: Sortie Internet, VPN de l’ORC et Smarty sur le TMS
  texte: |
    - Nouvelle rubrique « VPN du site (OpenVPN) » : service, interface du tunnel, pair, statut (octets entrés et revenus), historique des coupures, capture dans le tunnel, relance.
    - Réseau : résolution DNS, passerelle par défaut, sortie Internet du serveur, test de port avec code de retour (expiré ou refusé).
    - Smarty : « Où tourne Smarty ? ». Sur certains sites il est une application Tomcat du TMS, sans service smarty-tms ni dashboard.xml.
    - Procédures : plugin du TMS en « connect timed out », accès distant impossible alors que le VPN tourne, Smarty sur le TMS, salle absente de Smarty parce qu’elle ne répond pas.
    - Nouvelle variable « Nom ou IP d’un serveur distant » (HOTE) ; glossaire et règles complétés.
- date: 2026-10-19
  titre: Smarty, baie Ymagis et serveur absent du réseau
  texte: |
    - Nouvelle rubrique « Smarty (YMS) » et filtre machine YMS : connexion, fraîcheur du tableau de bord, journaux, arrêt et relance.
    - Procédures Smarty : tableau de bord figé, salles absentes (Sarah + Puppet), purge des bases.
    - Procédure « ORC / TMS injoignables : serveur absent du réseau cabine », avec les vérifications sur site.
    - Repères baie Ymagis : adresses type, ports du switch, fabricant d’après la MAC, serveur Dell (F2/F11, DRAC).
    - Variables SITE (code site) et SMARTY dans « Mon site ».
- date: 2026-10-18
  titre: Nouvelle rubrique « Fichiers & transferts »
  texte: |
    - Lire un gros log avec less, retrouver ce qui a changé depuis hier, comparer une sauvegarde, copier avec scp ou rsync, vérifier une copie, préparer une archive de logs pour un ticket.
    - Repères ORC : schéma du chemin TMS → ORC → salle. Glossaire enrichi (bridge, bond, MAC, ARP, DHCP, SNMP…).
- date: 2026-10-18
  titre: Relecture complète de l’outil
  texte: |
    - Toutes les fiches ont désormais au moins une aide à la lecture (résultat attendu, comment lire, exemple).
    - Chaque étape de procédure indique ce qu’on doit voir.
    - « Copier tout » n’apparaît plus quand une étape demande un mot de passe ou ouvre une session (ssh, sudo, ftp) : la saisie avalerait les lignes collées ensuite.
    - Nouvelle fiche « Serveur de la salle joignable ? ».
    - Mon site : chaque champ montre un exemple et son libellé complet.
- date: 2026-10-18
  titre: Version 3 en ligne
  texte: |
    - Le mémo devient une application en ligne, partagée par toute l’équipe et mise à jour en direct.
    - Chaque commande s’explique : décomposition, exemple de sortie, comment lire le résultat, que faire si ça ne va pas.
    - Nouvelle rubrique « Apprendre » pour débuter en SSH.
    - Lien direct vers chaque fiche (bouton 🔗) à coller dans un ticket.
